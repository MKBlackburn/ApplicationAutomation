[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "application-automation"
version = "0.1.0"
description = "Human-reviewed job application preparation"
requires-python = ">=3.11"
dependencies = ["playwright>=1.49,<2"]

[project.scripts]
application-automation = "application_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
